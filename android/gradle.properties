org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
android.useAndroidX=true
# MapKit 4.45 собран под Java 21. Flutter берёт JDK 17 из Android Studio,
# и сборка приложения такой класс не читает. Путь к JDK 21 задайте у себя
# в ~/.gradle/gradle.properties:
# org.gradle.java.home=/path/to/jdk-21
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
